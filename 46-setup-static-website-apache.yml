---
- name: Install apache with custom website playbook
  hosts: studentvms
  become: yes

  tasks:
    - name: Ensure apache2 is present
      apt:
        name: apache2
        state: present
        update_cache: yes

    - name: "Deploy custom index.html page inline"
      copy:
        content: |
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Danish Nazir - DevOps Lab 46 (Method 2 Inline)</title>
              <style>
                  body {
                      font-family: Arial, sans-serif;
                      background: #0f172a;
                      color: #f8fafc;
                      text-align: center;
                      margin-top: 100px;
                  }
                  .card {
                      background: #1e293b;
                      border: 1px solid #334155;
                      border-radius: 16px;
                      padding: 40px;
                      display: inline-block;
                      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
                  }
                  .badge {
                      background: #6366f1;
                      color: white;
                      padding: 8px 16px;
                      border-radius: 20px;
                      font-weight: bold;
                      font-size: 13px;
                  }
                  h1 {
                      color: #38bdf8;
                      margin: 20px 0 10px 0;
                  }
                  p {
                      color: #94a3b8;
                      font-size: 16px;
                  }
              </style>
          </head>
          <body>
              <div class="card">
                  <span class="badge">METHOD 2: INLINE YAML CONTENT</span>
                  <h1>⚡ Deployed Without External Files!</h1>
                  <p>This entire webpage was embedded directly inside the <strong>Ansible Playbook</strong>.</p>
              </div>
          </body>
          </html>
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'

    - name: Ensure Apache is running and enabled
      service:
        name: apache2
        state: started
        enabled: yes
